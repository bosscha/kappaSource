[package]
name = "kappasource"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kappa_extract"
path = "src/bin/extract.rs"

[[bin]]
name = "kappa_extract_gpu"
path = "src/bin/extract_gpu.rs"

[[bin]]
name = "kappa_generate"
path = "src/main.rs"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
wgpu = "30.0.1"
pollster = "1.0.1"
bytemuck = { version = "1.25", features = ["derive"] }
